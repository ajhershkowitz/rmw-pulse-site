<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Connect · RMW Social Pulse</title>
<style>
  body { margin: 0; background: #0e1a2e; color: #f5f6f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 24px; }
  p, li { color: #b4b8bf; line-height: 1.55; font-size: 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 120px; font: 14px ui-monospace, Consolas, monospace; padding: 10px; border-radius: 10px; border: 1px solid #434c5c; background: #1f2a3d; color: #f5f6f7; }
  button { font: inherit; font-size: 17px; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: #5b8fe0; color: #0b0f19; cursor: pointer; }
  .bad { color: #ff8080; }
</style>
</head>
<body>
<main>
  <h1 id="h">Almost connected</h1>
  <p id="lead">Copy this whole address, then paste it into the <b>Connect a platform</b> workflow on GitHub (or give it to Claude, who will tell you where to paste it). It works once, for a few minutes.</p>
  <textarea id="u" readonly></textarea>
  <button id="c" type="button">Copy the address</button>
  <p>Nothing here is saved or sent anywhere by this page.</p>
</main>
<script>
const u = document.getElementById('u');
u.value = location.href;
const q = new URLSearchParams(location.search);
if (q.get('error')) { document.getElementById('h').textContent = 'Access was not given'; document.getElementById('lead').className = 'bad'; document.getElementById('lead').textContent = 'The platform says: ' + (q.get('error_description') || q.get('error')) + '. Start the connect step again and press Allow.'; }
else if (!q.get('code')) { document.getElementById('h').textContent = 'Connect page'; document.getElementById('lead').textContent = 'This is where YouTube and TikTok send you back after you approve access. There is nothing to copy yet.'; }
document.getElementById('c').addEventListener('click', async () => { u.select(); try { await navigator.clipboard.writeText(u.value); } catch (e) { document.execCommand('copy'); } document.getElementById('c').textContent = 'Copied ✓'; });
</script>
</body>
</html>
